<section>
  <div class="flex flex-col items-center py-4">
    <h1 class="text-6xl font-bold leading-none text-white">Quizz Aléatoire</h1>
  </div>
</section> 
<section>
  <div class="flex flex-col items-center py-4">
    <h2 class="mt-5 text-white text-lg">Remplissez les champs pour configurer votre quizz</h2>
  </div>
</section> 

<div class="px-4 py-6 mx-auto max-w-7xl sm:px-6 md:px-12 lg:px-24 lg:py-12">
    <div class="justify-center mx-auto text-left align-bottom transition-all transform rounded-lg sm:align-middle sm:max-w-2xl sm:w-full">
        
        <div class="grid flex-wrap items-center justify-center grid-cols-1 mx-auto shadow-xl lg:grid-cols-1 rounded-xl">
        <div class="w-full px-6 py-3">
          <br>
            <p class="text-2xl font-bold text-white w-full mb-2"> Générer un Quizz Aléatoire</p>
          <br>
  
            <div class="mb-4">
            <label for="quizName" class="block text-sm font-medium text-gray-300">Titre du Quizz</label>
            <input [(ngModel)]="quizName" id="quizName" type="text" placeholder="Entrez le nom du quizz" 
            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700 text-gray-700" required>
            </div>
            <br>
  
            <div class="mb-4">
            <label for="technology" class="block text-sm font-medium text-gray-300">Technologie</label>
            <select [(ngModel)]="selectedTechnology" id="technology" placeholder="Choisir la technologie" 
            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700">
                <option *ngFor="let tech of technologies" [value]="tech">{{ tech }}</option>
            </select>
            </div>
            <br>

        
            <div class="mb-4">
                <label for="technology" class="block text-sm font-medium text-gray-300">Nombre de questions</label>
                <input type="number" min="5" max="40" id="questionCount" [(ngModel)]="questionCount"
            name="questionCount"
            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700"
            placeholder="Entrez le nombre de questions" required />
            </div>

            <div class="mb-4 text-red-600" *ngIf="errorMessage">
              {{ errorMessage }}
            </div>
    <div class="mb-4">
        <label class="block text-sm font-medium text-gray-300">Niveau</label>
        <div class="flex space-x-4">
          <ng-container *ngFor="let level of levels">
            <label class="inline-flex items-center">
              <input type="radio" [(ngModel)]="selectedLevel" [value]="level" class="form-radio text-indigo-600">
              <span class="ml-2">{{ level }}</span>
            </label>
          </ng-container>
        </div>
        <br>
    <div class="flex space-x-4">
      <button (click)="generateAndSendQuiz()" class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">Générer et envoyer</button>
      <button (click)="getQuizUrl()" class="px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-700 animate-pulse hover:bg-blue-900">Get URL</button>
    </div>
    
  </div>
