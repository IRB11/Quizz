<section>
  <div class="flex justify-center py-6">
    <h1 class="max-w-5xl text-2xl font-bold leading-none text-white md:text-5xl lg:text-6xl lg:max-w-7xl">
      Résultats des quizz passés
    </h1>
  </div>
</section> 

<section>
  <div class="flex flex-col items-center py-4">
    <h2 class="text-4xl font-bold leading-none text-white">Générateur de résultats</h2>
    <p class="mt-5 text-white text-lg">Télécharger les résultats de vos candidats</p>
  </div>
</section> 

<div class="px-4 py-12 mx-auto max-w-7xl sm:px-6 md:px-12 lg:px-24 lg:py-12">
    <div class="justify-center mx-auto text-left align-bottom transition-all transform rounded-lg sm:align-middle sm:max-w-2xl sm:w-full">
      
      <div class="grid text-center flex-wrap items-center justify-center grid-cols-1 mx-auto shadow-xl lg:grid-cols-1 rounded-xl">
        <div class="w-full px-6 py-3">
          <p class="text-2xl font-bold text-white mb-2 py-6">Générer les résultats</p>
  
          <div class="mb-4">
            <input [(ngModel)]="candidateNameOrUrl" id="candidateNameOrUrl" type="text" placeholder="Entrez le nom ou l'URL du quizz"
                   class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-gray-700 text-gray-700" required>
          </div>
  
          <div class="flex justify-center">
            <button (click)="loadPDF()" class="px-4 py-2 bg-blue-500 text-white rounded-md animate-pulse hover:bg-blue-900 ml-2">Télécharger le PDF</button>
          </div>
        </div>
      </div>
      
    </div>
  </div>
