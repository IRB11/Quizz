<div class="flex justify-center items-center min-h-screen bg-gray-100">
  <div class="bg-white shadow-md rounded-lg p-6 w-full max-w-lg" *ngIf="currentQuestion">
    <h2 class="text-2xl font-bold mb-4 text-center">{{ currentQuestion.question }}</h2>
    <div class="mb-6 text-center">
      <span class="text-sm text-gray-600">Difficulté : {{ currentQuestion.difficulty }}</span>
      <span class="text-sm text-gray-600 ml-4">Technologie : {{ currentQuestion.technology }}</span>
      <span class="text-sm text-gray-600 ml-4">Question : {{ currentQuestion }}</span>
    </div>
    <div *ngFor="let option of currentQuestion.options" class="mb-4">
      <label class="block">
        <input type="radio" name="option" class="mr-2">
        {{ option }}
      </label>
    </div>
    <div class="mt-6 flex justify-between"> 
      <!-- <button (click)="previousQuestion()" [disabled]="currentQuestionIndex === 0" class="bg-blue-500 text-white px-4 py-2 rounded disabled:opacity-50">Précédent</button> -->
      <button (click)="nextQuestion()" class="bg-blue-500 text-white px-4 py-2 rounded disabled:opacity-50">Valider</button>
    </div>
  </div>
</div>

<!-- [disabled]="currentQuestionIndex === questionsSubject.value.length - 1" -->
