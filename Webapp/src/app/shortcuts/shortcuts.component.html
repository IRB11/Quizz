<div class="container mx-auto mt-8 text-center">
    <br>
    <h1 class="text-2xl font-bold mb-4">Actions rapides</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div class="shortcut" *ngFor="let shortcut of shortcuts">
      <a [href]="shortcut.link" class="flex items-center space-x-2 p-4 bg-gray-200 rounded-lg shadow-md hover:bg-gray-300 transition-transform transform hover:-translate-y-1">
        <img src="../../assets/img/iconagentmanagement.png" alt="{{ shortcut.agentmanager }} icon" class="h-8 w-8"> 
        <span class="text-lg font-semibold ml-2">{{ shortcut.agentmanagement }}</span>
      </a>
      <a [href]="shortcut.link" class="flex items-center space-x-2 p-4 bg-gray-200 rounded-lg shadow-md hover:bg-gray-300 transition-transform transform hover:-translate-y-1">
        <img src="../../assets/img/iconresults.png" alt="{{ shortcut.agentmanager }} icon" class="h-8 w-8">  <!-- Utilisation de l'image de l'icône ici -->
        <span class="text-lg font-semibold ml-2">{{ shortcut.results }}</span>
      </a>
      <a [href]="shortcut.link" class="flex items-center space-x-2 p-4 bg-gray-200 rounded-lg shadow-md hover:bg-gray-300 transition-transform transform hover:-translate-y-1">
        <img src="../../assets/img/iconcandidats.png" alt="{{ shortcut.agentmanager }} icon" class="h-8 w-8">  <!-- Utilisation de l'image de l'icône ici -->
        <span class="text-lg font-semibold ml-2">{{ shortcut.candidats }}</span>
      </a>
        <a [href]="shortcut.link" class="flex items-center space-x-2 p-4 bg-gray-200 rounded-lg shadow-md hover:bg-gray-300 transition-transform transform hover:-translate-y-1">
            <img src="../../assets/img/iconquizzbank.png" alt="{{ shortcut.agentmanager }} icon" class="h-8 w-8"> <!-- Utilisation de l'image de l'icône ici -->
            <span class="text-lg font-semibold ml-2">{{ shortcut.quizzbank }}</span>
        </a>
          <a [href]="shortcut.link" class="flex items-center space-x-2 p-4 bg-gray-200 rounded-lg shadow-md hover:bg-gray-300 transition-transform transform hover:-translate-y-1">
            <img src="../../assets/img/iconplanning.png" alt="{{ shortcut.agentmanager }} icon" class="h-8 w-8"> <!-- Utilisation de l'image de l'icône ici -->
            <span class="text-lg font-semibold ml-2">{{ shortcut.planning }}</span>
          </a>
          <a [href]="shortcut.link" class="flex items-center space-x-2 p-4 bg-gray-200 rounded-lg shadow-md hover:bg-gray-300 transition-transform transform hover:-translate-y-1">
            <img src="../../assets/img/icongenererquizz.png" alt="{{ shortcut.agentmanager }} icon" class="h-8 w-8"> <!-- Utilisation de l'image de l'icône ici -->
            <span class="text-lg font-semibold ml-2">{{ shortcut.genererquizz }}</span>
          </a>
          <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 translate-y-full bg-black text-white text-xs rounded-md py-1 px-2 opacity-0 group-hover:opacity-100 transition-opacity">
            {{ shortcut.description }}
    </div>
  </div>
