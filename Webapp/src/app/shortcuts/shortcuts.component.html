<section> 
  <div class="container mx-auto mt-8 text-center">
     <br>
     <h1 class="text-2xl font-bold text-white mb-6">Actions rapides</h1>
       <div class="grid grid-cols-1 flex gap-x-4 md:grid-cols-2 lg:grid-cols-6 gap-0.5rem">
         <div class="shortcut" *ngFor="let shortcut of shortcuts">
           <a [href]="shortcut.link" class="flex items-center space-x-1 p-4 bg-gray-200 rounded-lg shadow-md hover:bg-gray-300 transition-transform transform hover:-translate-y-1">
           <img src="{{shortcut.iconUrl}}" alt="{{ shortcut.agentmanager }} icon" [title]="shortcut.description"  class="h-8 w-8"> 
           <span class="text-lg font-semibold ml-2">{{ shortcut.agentmanagement }}</span>
           </a>
         </div>
       </div>
 </div>
</section>
